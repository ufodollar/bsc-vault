name: Deploy Contracts to BSC

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install Dependencies
        run: forge install OpenZeppelin/openzeppelin-contracts --no-commit

      - name: Deploy Contracts
        env:
          RPC_URL: "https://bsc-rpc.publicnode.com"
          MAIN_PK: ${{ secrets.MAIN_PRIVATE_KEY }}
          MAIN_ADDR: ${{ secrets.MAIN_WALLET_ADDRESS }}
        run: |
          if [ -z "$MAIN_PK" ] || [ -z "$MAIN_ADDR" ]; then
            echo "❌ 错误：Secrets 中的 MAIN_PRIVATE_KEY 或 MAIN_WALLET_ADDRESS 为空！"
            exit 1
          fi
          forge script script/Deploy.s.sol:DeployScript --rpc-url $RPC_URL --private-key $MAIN_PK --broadcast --legacy