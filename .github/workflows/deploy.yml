name: Deploy Contracts to BSC

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install Dependencies
        run: |
          forge install OpenZeppelin/openzeppelin-contracts@v5.0.2 --no-commit

      - name: Check Secrets and Deploy
        env:
          RPC_URL: "https://bsc-rpc.publicnode.com"
          DEPLOYER_PK: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          MAIN_ADDR: ${{ secrets.MAIN_WALLET_ADDRESS }}
        run: |
          echo "🔍 检查环境变量..."
          if [ -z "$DEPLOYER_PK" ]; then
            echo "❌ 错误：DEPLOYER_PRIVATE_KEY 未配置或为空！"
            exit 1
          fi
          if [ -z "$MAIN_ADDR" ]; then
            echo "❌ 错误：MAIN_WALLET_ADDRESS 未配置或为空！"
            exit 1
          fi
          
          echo "🚀 开始编译并部署到 BSC..."
          forge script script/Deploy.s.sol:DeployScript --rpc-url $RPC_URL --private-key $DEPLOYER_PK --broadcast --legacy