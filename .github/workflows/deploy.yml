name: Deploy Contracts to BSC

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Check Balance & Deploy
        env:
          RPC_URL: "https://bsc-rpc.publicnode.com"
          MAIN_PK: ${{ secrets.MAIN_PRIVATE_KEY }}
          MAIN_ADDR: ${{ secrets.MAIN_WALLET_ADDRESS }}
        run: |
          set +e
          echo "🔍 1. 检查环境变量..."
          if [ -z "$MAIN_PK" ]; then
            echo "❌ 错误：MAIN_PRIVATE_KEY 为空！"
            exit 1
          fi
          if [ -z "$MAIN_ADDR" ]; then
            echo "❌ 错误：MAIN_WALLET_ADDRESS 为空！"
            exit 1
          fi
          echo "✅ 环境变量通过。"

          echo "🔍 2. 检查余额..."
          BALANCE=$(cast balance $MAIN_ADDR --rpc-url $RPC_URL)
          echo "当前余额: $BALANCE wei"
          if [ "$BALANCE" -eq 0 ]; then
            echo "❌ 错误：钱包里没有 BNB！"
            exit 1
          fi

          echo "🔍 3. 开始部署代币..."
          TOKEN_OUT=$(forge create src/UFOToken.sol:UFOToken --private-key $MAIN_PK --rpc-url $RPC_URL --broadcast --chain-id 56 --legacy --gas-price 1gwei 2>&1)
          echo "$TOKEN_OUT"
          TOKEN=$(echo "$TOKEN_OUT" | grep -oE '0x[a-fA-F0-9]{40}' | tail -n 1)
          if [ -z "$TOKEN" ]; then
            echo "❌ 代币部署失败！"
            exit 1
          fi
          echo "✅ 代币地址: $TOKEN"

          echo "🔍 4. 开始部署金库..."
          sed -i "s|address public constant PROFIT_RECIPIENT = .*;|address public constant PROFIT_RECIPIENT = $MAIN_ADDR;|g" src/UFOVault.sol
          VAULT_OUT=$(forge create src/UFOVault.sol:UFOVault --constructor-args $TOKEN --private-key $MAIN_PK --rpc-url $RPC_URL --broadcast --chain-id 56 --legacy --gas-price 1gwei 2>&1)
          echo "$VAULT_OUT"
          VAULT=$(echo "$VAULT_OUT" | grep -oE '0x[a-fA-F0-9]{40}' | tail -n 1)
          if [ -z "$VAULT" ]; then
            echo "❌ 金库部署失败！"
            exit 1
          fi
          echo "✅ 金库地址: $VAULT"

          echo "🔍 5. 开始授权..."
          cast send $TOKEN "setMinter(address,bool)" $VAULT true --private-key $MAIN_PK --rpc-url $RPC_URL --legacy --gas-price 1gwei
          echo "✅ 授权成功！"

          echo "=== 🎉 最终部署结果 ==="
          echo "新代币地址: $TOKEN"
          echo "新金库地址: $VAULT"
