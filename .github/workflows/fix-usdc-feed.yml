name: Fix USDC Price Feed on Vault

on:
  workflow_dispatch:

jobs:
  fix-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Call setPriceFeed
        env:
          RPC_URL: "https://bsc-dataseed.binance.org"
          RAW_PK: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          VAULT_ADDRESS: "0x5C4eb7b82EFc4840e2fDa80Df73C53dc6b914790"
          USDC_ADDRESS: "0x8AC76a51cc950d9822D68b83fE1Ad97B32Cd580d"
          # 借用 USDT 的 Chainlink 喂价给 USDC 使用
          USDT_FEED: "0xB97Ad0E74fa7d920791E90258A6E2085088b4320"
        run: |
          echo "🔍 正在清洗私钥..."
          CLEAN_PK=$(echo "$RAW_PK" | tr -d '[:space:]')
          if [[ ! "$CLEAN_PK" == 0x* ]]; then
            CLEAN_PK="0x$CLEAN_PK"
          fi
          export DEPLOYER_PK=$CLEAN_PK
          
          echo "🔧 正在修复 USDC 的 Chainlink 喂价地址..."
          # 调用 setPriceFeed(address _token, address _newFeed)
          cast send $VAULT_ADDRESS "setPriceFeed(address,address)" $USDC_ADDRESS $USDT_FEED --rpc-url $RPC_URL --private-key $DEPLOYER_PK --legacy
          
          echo "✅ 修复完成！新金库的 USDC 已成功绑定喂价。"