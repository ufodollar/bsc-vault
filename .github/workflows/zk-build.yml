name: Compile ZK Circuit and Generate Verifier

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build-zk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download precompiled Circom
        run: |
          wget https://github.com/iden3/circom/releases/download/v2.1.8/circom-linux-amd64
          chmod +x circom-linux-amd64
          mv circom-linux-amd64 /usr/local/bin/circom
          circom --version

      - name: Compile Circuit
        run: |
          cd circuits
          circom multiplier.circom --r1cs --wasm --sym

      - name: Download Powers of Tau
        run: |
          wget https://hermez.s3-eu-west-1.amazonaws.com/powersOfTau28_hez_final_12.ptau

      - name: Groth16 Setup & Export Verifier
        run: |
          cd circuits
          npx snarkjs groth16 setup multiplier.r1cs ../powersOfTau28_hez_final_12.ptau multiplier_0000.zkey
          npx snarkjs zkey contribute multiplier_0000.zkey multiplier_final.zkey --name="UFO" -e="some random text for ufo"
          npx snarkjs zkey export verificationkey multiplier_final.zkey verification_key.json
          npx snarkjs zkey export solidityverifier multiplier_final.zkey Verifier.sol

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zk-outputs
          path: |
            circuits/multiplier_js/multiplier.wasm
            circuits/multiplier_final.zkey
            circuits/Verifier.sol
            circuits/verification_key.json