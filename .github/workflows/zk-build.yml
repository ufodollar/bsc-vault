name: Compile ZK Circuit and Generate Verifier

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build-zk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm init -y
          npm install circom2 snarkjs

      - name: Compile Circuit
        run: |
          npx circom2 multiplier.circom --r1cs --wasm --sym

      - name: Download Powers of Tau (Pot 08)
        run: |
          echo "Downloading ptau..."
          wget -q https://hermez.s3-eu-west-1.amazonaws.com/powersOfTau28_hez_final_08.ptau
          ls -lh powersOfTau28_hez_final_08.ptau

      - name: Generate Keys and Verifier
        run: |
          npx snarkjs groth16 setup multiplier.r1cs powersOfTau28_hez_final_08.ptau multiplier_0000.zkey
          npx snarkjs zkey contribute multiplier_0000.zkey multiplier_final.zkey --name="UFO" -e="random entropy for ufo"
          npx snarkjs zkey export verificationkey multiplier_final.zkey verification_key.json
          npx snarkjs zkey export solidityverifier multiplier_final.zkey Verifier.sol

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zk-outputs
          path: |
            multiplier_js/multiplier.wasm
            multiplier_final.zkey
            Verifier.sol
            verification_key.json