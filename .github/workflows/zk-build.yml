name: Compile ZK Circuit and Generate Verifier

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build-zk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm init -y
          npm install circom2 snarkjs

      - name: Create and Compile Circuit
        run: |
          cat << 'EOF' > multiplier.circom
          pragma circom 2.0.0;
          template Multiplier() {
              signal input a;
              signal input b;
              signal output c;
              c <== a * b;
          }
          component main = Multiplier();
          EOF
          
          echo "文件已生成，开始编译："
          npx circom2 multiplier.circom --r1cs --wasm --sym

      # 🔥 终极绝招：直接在本地生成 ptau 文件，不下载了！
      - name: Generate Powers of Tau Locally
        run: |
          echo "开始本地生成 ptau (这步需要大概1分钟)..."
          npx snarkjs powersoftau new bn128 12 pot12_0000.ptau -v
          npx snarkjs powersoftau contribute pot12_0000.ptau pot12_0001.ptau --name="UFO" -e="some random entropy" -v
          npx snarkjs powersoftau prepare phase2 pot12_0001.ptau pot12_final.ptau -v
          echo "✅ ptau 文件本地生成成功！"

      - name: Generate Keys and Verifier
        run: |
          npx snarkjs groth16 setup multiplier.r1cs pot12_final.ptau multiplier_0000.zkey
          npx snarkjs zkey contribute multiplier_0000.zkey multiplier_final.zkey --name="UFO" -e="more random entropy for ufo"
          npx snarkjs zkey export verificationkey multiplier_final.zkey verification_key.json
          npx snarkjs zkey export solidityverifier multiplier_final.zkey Verifier.sol
          echo "✅ 验证器生成完毕！"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zk-outputs
          path: |
            multiplier_js/multiplier.wasm
            multiplier_final.zkey
            Verifier.sol
            verification_key.json