name: Compile ZK Circuit and Generate Verifier

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build-zk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm init -y
          npm install circom2 snarkjs

      - name: Create and Compile Circuit
        run: |
          cat << 'EOF' > multiplier.circom
          pragma circom 2.0.0;
          template Multiplier() {
              signal input a;
              signal input b;
              signal output c;
              c <== a * b;
          }
          component main = Multiplier();
          EOF
          
          echo "文件已生成，开始编译："
          npx circom2 multiplier.circom --r1cs --wasm --sym

      # 🔥 换成官方 Google Cloud 镜像，并加入大小检查
      - name: Download Powers of Tau
        run: |
          echo "Downloading ptau from Google Cloud (ZKEVM)..."
          wget https://storage.googleapis.com/zkevm/ptau/powersOfTau28_hez_final_12.ptau -O pot12_final.ptau
          
          echo "检查下载的文件大小："
          ls -lh pot12_final.ptau
          
          # 如果文件小于 1MB (例如之前的 395 字节)，说明下载的是假网页，直接报错退出
          FILE_SIZE=$(stat -c%s pot12_final.ptau)
          if [ "$FILE_SIZE" -lt 1000000 ]; then
            echo "❌ 错误：下载的文件太小，可能被拦截了！"
            exit 1
          fi
          echo "✅ ptau 文件下载成功！"

      - name: Generate Keys and Verifier
        run: |
          npx snarkjs groth16 setup multiplier.r1cs pot12_final.ptau multiplier_0000.zkey
          npx snarkjs zkey contribute multiplier_0000.zkey multiplier_final.zkey --name="UFO" -e="random entropy for ufo"
          npx snarkjs zkey export verificationkey multiplier_final.zkey verification_key.json
          npx snarkjs zkey export solidityverifier multiplier_final.zkey Verifier.sol

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zk-outputs
          path: |
            multiplier_js/multiplier.wasm
            multiplier_final.zkey
            Verifier.sol
            verification_key.json