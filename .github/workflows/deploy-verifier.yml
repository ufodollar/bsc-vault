name: Deploy Verifier to BSC

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install Dependencies
        run: |
          forge install OpenZeppelin/openzeppelin-contracts@v5.0.2 --no-commit

      - name: Check Secrets and Deploy Verifier
        env:
          # 🔥 换成了 BNB 官方最稳定的 RPC 节点，绝不会返回 403
          RPC_URL: "https://bsc-dataseed.binance.org"
          RAW_PK: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        run: |
          echo "🔍 正在清洗私钥..."
          CLEAN_PK=$(echo "$RAW_PK" | tr -d '[:space:]')
          if [[ ! "$CLEAN_PK" == 0x* ]]; then
            CLEAN_PK="0x$CLEAN_PK"
          fi
          export DEPLOYER_PK=$CLEAN_PK
          
          echo "🚀 开始部署 Groth16Verifier 到 BSC..."
          
          # 直接部署 Groth16Verifier，不加任何多余的尝试
          forge create src/Verifier.sol:Groth16Verifier --rpc-url $RPC_URL --private-key $DEPLOYER_PK --broadcast --legacy