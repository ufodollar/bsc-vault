name: Build Enterprise ZK Circuit

on:
  workflow_dispatch:

jobs:
  build-zk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm init -y
          npm install circom2 snarkjs

      # 1. 下载官方的 circomlib 密码学库
      - name: Clone Circomlib
        run: |
          git clone https://github.com/iden3/circomlib.git

      # 2. 编译真正的隐私电路
      - name: Compile Privacy Circuit
        run: |
          # 注意：我们使用 circom2 编译，指定 include 路径
          npx circom2 circuits/ufo_privacy.circom --r1cs --wasm --sym -l ./circomlib/circuits

      # 3. 本地生成 ptau (避坑 403 错误)
      - name: Generate Powers of Tau
        run: |
          echo "开始本地生成 ptau (12阶) ..."
          npx snarkjs powersoftau new bn128 12 pot12_0000.ptau -v
          npx snarkjs powersoftau contribute pot12_0000.ptau pot12_0001.ptau --name="UFO" -e="random entropy" -v
          npx snarkjs powersoftau prepare phase2 pot12_0001.ptau pot12_final.ptau -v

      # 4. 生成密钥与链上验证器
      - name: Setup Groth16 & Export Verifier
        run: |
          npx snarkjs groth16 setup ufo_privacy.r1cs pot12_final.ptau ufo_privacy_0000.zkey
          npx snarkjs zkey contribute ufo_privacy_0000.zkey ufo_privacy_final.zkey --name="UFO" -e="more random entropy"
          npx snarkjs zkey export verificationkey ufo_privacy_final.zkey verification_key.json
          npx snarkjs zkey export solidityverifier ufo_privacy_final.zkey Verifier.sol

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-zk-outputs
          path: |
            ufo_privacy_js/ufo_privacy.wasm
            ufo_privacy_final.zkey
            Verifier.sol
            verification_key.json